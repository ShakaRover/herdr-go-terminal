id = "herdrgot"
name = "HerdrGoT"
version = "3.0.3"
min_herdr_version = "0.8.2"
description = "Native mobile remote control bridge for Herdr"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "plugin/install.sh"]

[[actions]]
id = "setup"
title = "Set up HerdrGoT bridge"
contexts = ["workspace"]
command = ["sh", "plugin/herdrgot-action.sh", "setup-ui"]

[[actions]]
id = "pair"
title = "Pair HerdrGoT"
contexts = ["workspace"]
command = ["sh", "plugin/herdrgot-action.sh", "pair-ui"]

[[actions]]
id = "pair-string"
title = "Show HerdrGoT pairing string"
contexts = ["workspace"]
command = ["sh", "plugin/herdrgot-action.sh", "pair-string-ui"]

[[actions]]
id = "status"
title = "Show HerdrGoT status"
contexts = ["workspace"]
command = ["sh", "plugin/herdrgot-action.sh", "status-ui"]

[[actions]]
id = "start"
title = "Start HerdrGoT bridge"
contexts = ["workspace"]
command = ["sh", "plugin/herdrgot-ctl.sh", "start"]

[[actions]]
id = "stop"
title = "Stop HerdrGoT bridge"
contexts = ["workspace"]
command = ["sh", "plugin/herdrgot-ctl.sh", "stop"]

[[actions]]
id = "restart"
title = "Restart HerdrGoT bridge"
contexts = ["workspace"]
command = ["sh", "plugin/herdrgot-ctl.sh", "restart"]

[[actions]]
id = "uninstall-service"
title = "Uninstall HerdrGoT bridge service"
contexts = ["workspace"]
command = ["sh", "plugin/herdrgot-action.sh", "uninstall-service-ui"]

[[panes]]
id = "setup-ui"
title = "HerdrGoT Setup"
placement = "zoomed"
command = ["sh", "plugin/herdrgot-ctl.sh", "setup"]

[[panes]]
id = "pair-ui"
title = "Pair HerdrGoT"
placement = "overlay"
command = ["sh", "plugin/herdrgot-ctl.sh", "pair"]

[[panes]]
id = "pair-string-ui"
title = "HerdrGoT Pairing String"
placement = "overlay"
command = ["sh", "plugin/herdrgot-ctl.sh", "pair", "--string"]

[[panes]]
id = "status-ui"
title = "HerdrGoT Status"
placement = "overlay"
command = ["sh", "plugin/herdrgot-ctl.sh", "status"]

[[panes]]
id = "uninstall-service-ui"
title = "Uninstall HerdrGoT bridge service"
placement = "zoomed"
command = ["sh", "plugin/herdrgot-ctl.sh", "uninstall-service"]
