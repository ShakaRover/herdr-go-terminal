[package]
name = "herdrgo-bridge"
version = "3.0.1"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "process"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
wyhash = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
qrcode = { version = "0.14", default-features = false }
url = "2"
easytier = { git = "https://github.com/EasyTier/EasyTier.git", rev = "81487c363a56779e745eae927e130a813535c71e", default-features = false, features = [
    "smoltcp", "aes-gcm", "dhcp-ipv4", "tracing-log", "endpoint-discovery",
] }
easytier-core = { git = "https://github.com/EasyTier/EasyTier.git", rev = "81487c363a56779e745eae927e130a813535c71e", default-features = false, features = [
    "endpoint-discovery",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
opt-level = 2
lto = true
strip = true
codegen-units = 1
