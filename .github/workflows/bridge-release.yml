name: Bridge release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/bridge-ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: aarch64-apple-darwin
            runner: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          grep -Fqx "version = \"${version}\"" herdr-plugin.toml
          grep -Fqx "version = \"${version}\"" bridge/Cargo.toml

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools protobuf-compiler

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Configure musl compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "${GITHUB_ENV}"
              echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "${GITHUB_ENV}"
              ;;
            aarch64-unknown-linux-musl)
              echo 'CC_aarch64_unknown_linux_musl=musl-gcc' >> "${GITHUB_ENV}"
              echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "${GITHUB_ENV}"
              ;;
          esac

      - name: Build bridge
        run: >-
          cargo build --locked --release
          --manifest-path bridge/Cargo.toml
          --target ${{ matrix.target }}

      - name: Package bridge
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          asset="herdrgo-bridge-${version}-${target}.tar.gz"
          binary="bridge/target/${target}/release/herdrgo-bridge"
          mkdir -p dist/package
          cp "${binary}" dist/package/herdrgo-bridge
          chmod 755 dist/package/herdrgo-bridge
          tar -czf "dist/${asset}" -C dist/package herdrgo-bridge
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${asset}" > "${asset}.sha256")
          else
            (cd dist && shasum -a 256 "${asset}" > "${asset}.sha256")
          fi
          {
            printf 'herdrgo_version=%s\n' "${version}"
            printf 'herdrgo_commit=%s\n' "${GITHUB_SHA}"
            printf 'easytier_commit=%s\n' \
              '81487c363a56779e745eae927e130a813535c71e'
            printf 'target=%s\n' "${target}"
          } > "dist/${asset}.provenance.txt"

      - name: Upload target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.provenance.txt
          if-no-files-found: error

  android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          grep -Fqx "version = \"${version}\"" herdr-plugin.toml
          grep -Fqx "version = \"${version}\"" bridge/Cargo.toml
          grep -Eq "^version: ${version}\+[1-9][0-9]*$" app/pubspec.yaml

      - name: Verify Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!variable:-}" ]; then
              echo "Missing required Actions secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Check out EasyTier source
        uses: actions/checkout@v4
        with:
          repository: KKRainbow/EasyTier-1
          ref: ae8f4398240e103e0bde89e38497612a18a65c85
          path: easytier

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: easytier
          cache-on-failure: true

      - name: Install Android native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build EasyTier JNI libraries
        env:
          EASYTIER_REPO: ${{ github.workspace }}/easytier
        run: |
          app/tool/sync_easytier.sh
          git diff --exit-code -- \
            app/android/app/src/main/kotlin/com/easytier/jni/EasyTierJNI.kt

      - name: Test Flutter app
        working-directory: app
        run: |
          flutter pub get
          flutter test

      - name: Materialize Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          keystore_file="${RUNNER_TEMP}/herdrgo-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | \
            base64 --decode > "${keystore_file}"
          chmod 600 "${keystore_file}"
          echo "ANDROID_KEYSTORE_FILE=${keystore_file}" >> "${GITHUB_ENV}"

      - name: Build signed universal APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: app
        run: flutter build apk --release

      - name: Package Android artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          source_apk="app/build/app/outputs/flutter-apk/app-release.apk"
          asset="HerdrGo-${version}-android.apk"
          aapt="${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt"
          apksigner="${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          zipalign="${ANDROID_SDK_ROOT}/build-tools/36.0.0/zipalign"

          "${aapt}" dump badging "${source_apk}" | \
            grep -Fqx "native-code: 'arm64-v8a' 'x86_64'"
          unzip -Z1 "${source_apk}" | \
            grep -Fqx 'lib/arm64-v8a/libeasytier_android_jni.so'
          unzip -Z1 "${source_apk}" | \
            grep -Fqx 'lib/x86_64/libeasytier_android_jni.so'
          "${zipalign}" -c -P 16 4 "${source_apk}"
          "${apksigner}" verify --verbose --print-certs "${source_apk}"

          mkdir -p dist
          cp "${source_apk}" "dist/${asset}"
          (cd dist && sha256sum "${asset}" > "${asset}.sha256")
          signer_digest=$("${apksigner}" verify --print-certs "${source_apk}" | \
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "${signer_digest}"
          {
            printf 'herdrgo_version=%s\n' "${version}"
            printf 'herdrgo_commit=%s\n' "${GITHUB_SHA}"
            printf 'easytier_commit=%s\n' \
              'ae8f4398240e103e0bde89e38497612a18a65c85'
            printf 'target=android-universal\n'
            printf 'signer_cert_sha256=%s\n' "${signer_digest}"
          } > "dist/${asset}.provenance.txt"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            dist/*.apk
            dist/*.sha256
            dist/*.provenance.txt
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        shell: bash
        run: |
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then
            rm -f -- "${ANDROID_KEYSTORE_FILE}"
          fi

  publish:
    name: Publish GitHub release
    needs:
      - build
      - android
    runs-on: ubuntu-24.04
    steps:
      - name: Download target artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
