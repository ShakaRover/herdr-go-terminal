name: Bridge release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/bridge-ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: aarch64-apple-darwin
            runner: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          grep -Fqx "version = \"${version}\"" herdr-plugin.toml
          grep -Fqx "version = \"${version}\"" bridge/Cargo.toml

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools protobuf-compiler

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Configure musl compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "${GITHUB_ENV}"
              echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "${GITHUB_ENV}"
              ;;
            aarch64-unknown-linux-musl)
              echo 'CC_aarch64_unknown_linux_musl=musl-gcc' >> "${GITHUB_ENV}"
              echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "${GITHUB_ENV}"
              ;;
          esac

      - name: Build bridge
        run: >-
          cargo build --locked --release
          --manifest-path bridge/Cargo.toml
          --target ${{ matrix.target }}

      - name: Package bridge
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          asset="herdrgo-bridge-${version}-${target}.tar.gz"
          binary="bridge/target/${target}/release/herdrgo-bridge"
          mkdir -p dist/package
          cp "${binary}" dist/package/herdrgo-bridge
          chmod 755 dist/package/herdrgo-bridge
          tar -czf "dist/${asset}" -C dist/package herdrgo-bridge
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${asset}" > "${asset}.sha256")
          else
            (cd dist && shasum -a 256 "${asset}" > "${asset}.sha256")
          fi
          {
            printf 'herdrgo_version=%s\n' "${version}"
            printf 'herdrgo_commit=%s\n' "${GITHUB_SHA}"
            printf 'easytier_commit=%s\n' \
              '81487c363a56779e745eae927e130a813535c71e'
            printf 'target=%s\n' "${target}"
          } > "dist/${asset}.provenance.txt"

      - name: Upload target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.provenance.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download target artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
